version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: cora_db
    environment:
      POSTGRES_DB: coradb
      POSTGRES_USER: corauser
      POSTGRES_PASSWORD: corapassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corauser -d coradb"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: cora_backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn cora_project.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - media_data:/app/media
      - C:/Moe/cora/resources:/moe_resources:ro
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: change-me-in-production
      DEBUG: "True"
      DB_HOST: db
      DB_NAME: coradb
      DB_USER: corauser
      DB_PASSWORD: corapassword
      # Accepter les requêtes venant de nginx et de ngrok
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:80,http://nginx
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: cora_frontend
    ports:
      - "3000:3000"
    environment:
      # URL relative : nginx proxy /api/ → backend
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_MEDIA_URL: ""
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: cora_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  media_data:
